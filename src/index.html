<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>StemForge</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#111213;
  --chassis:#1a1c1e;
  --panel:#202326;
  --raised:#2a2d31;
  --rim:#3a3d42;
  --border:#2e3136;
  --amber:#e8b84b;
  --cyan:#4be8c8;
  --pink:#e84b9a;
  --purple:#9a6be8;
  --red:#e84b4b;
  --green:#4be87a;
  --text:#ddd8d0;
  --muted:#5a606a;
  --dim:#3a3f46;
  --mono:'Share Tech Mono',monospace;
  --ui:'Rajdhani',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);overflow-x:hidden}

.chassis{
  min-height:100vh;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(0,0,0,.18) 39px,rgba(0,0,0,.18) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(0,0,0,.1) 39px,rgba(0,0,0,.1) 40px),
    var(--chassis);
  display:flex;flex-direction:column;
}

.rack-header{
  background:var(--panel);
  border-bottom:2px solid #000;
  box-shadow:0 2px 0 var(--rim);
  padding:10px 28px 10px;
  display:flex;align-items:center;justify-content:space-between;
  position:relative;
}
.rack-header::before,.rack-header::after{
  content:'';position:absolute;top:50%;transform:translateY(-50%);
  width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#555,#222);
  border:1px solid #111;
}
.rack-header::before{left:10px}
.rack-header::after{right:10px}

.brand{font-size:20px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:var(--amber)}
.brand em{color:var(--text);font-style:normal;font-weight:300}

.header-meters{display:flex;gap:3px;align-items:flex-end;height:30px}
.hm{width:5px;border-radius:1px 1px 0 0;background:var(--border);overflow:hidden;height:100%;position:relative}
.hm-fill{position:absolute;bottom:0;left:0;width:100%;transition:height .09s}
.hm:nth-child(1) .hm-fill,.hm:nth-child(2) .hm-fill{background:var(--green)}
.hm:nth-child(3) .hm-fill,.hm:nth-child(4) .hm-fill{background:var(--amber)}
.hm:nth-child(5) .hm-fill{background:#e87a4b}
.hm:nth-child(6) .hm-fill{background:var(--red)}

.online-badge{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px}
.led-round{width:9px;height:9px;border-radius:50%;background:#1a1a1a;border:1px solid #111;box-shadow:inset 0 1px 1px rgba(255,255,255,.05);transition:background .3s,box-shadow .3s}
.led-round.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.led-round.red{background:var(--red);box-shadow:0 0 6px var(--red)}

.upload-deck{
  margin:12px 12px 0;
  background:var(--panel);border:1px solid var(--border);border-radius:3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 2px 4px rgba(0,0,0,.4);
  overflow:hidden;
}
.deck-label{
  background:#181a1c;border-bottom:1px solid var(--border);
  padding:5px 12px;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;
}
.deck-inner{padding:14px;display:flex;align-items:center;gap:12px;position:relative}

.drop-target{
  flex:1;border:1.5px dashed var(--dim);border-radius:3px;
  padding:18px 12px;text-align:center;cursor:pointer;
  transition:border-color .2s,background .2s;position:relative;
  background:#191b1e;min-height:76px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
}
.drop-target:hover,.drop-target.over{border-color:var(--amber);background:#1e1c14}
.drop-target.loaded{border-color:var(--cyan);border-style:solid}
.drop-target input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-title{font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.drop-sub{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:2px}
.file-chip{
  background:rgba(75,232,200,.08);border:1px solid rgba(75,232,200,.3);border-radius:2px;
  padding:4px 10px;font-family:var(--mono);font-size:10px;color:var(--cyan);letter-spacing:1px;
  display:none;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.transport-col{display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0}
.big-btn{
  width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#3a3000,#1a1400);
  border:3px solid #111;
  box-shadow:0 4px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 4px rgba(0,0,0,.4);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .08s,box-shadow .08s;
}
.big-btn::after{
  content:'';width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e8c050,#c88a00);
  box-shadow:0 0 10px rgba(232,184,75,.35);
}
.big-btn:active{transform:scale(.93);box-shadow:0 2px 4px rgba(0,0,0,.8)}
.big-btn:disabled{opacity:.3;cursor:not-allowed}
.big-btn:disabled::after{background:radial-gradient(circle at 35% 30%,#555,#333);box-shadow:none}
.btn-label{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:2px;text-align:center;text-transform:uppercase}

.progress-rack{
  margin:10px 12px 0;background:var(--panel);border:1px solid var(--border);
  border-radius:3px;padding:10px 14px;display:none;
}
.progress-rack.show{display:block}
.pr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pr-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.pr-time{font-family:var(--mono);font-size:10px;color:var(--dim)}
.pr-track{background:#111;height:5px;border-radius:1px;overflow:hidden;border:1px solid var(--border)}
.pr-bar{height:100%;background:linear-gradient(90deg,var(--amber),var(--cyan));width:0%;transition:width .5s;border-radius:1px}
.pr-bar.pulse{animation:prpulse 1.3s ease-in-out infinite}
@keyframes prpulse{0%,100%{opacity:1}50%{opacity:.2}}

.error-rack{
  margin:8px 12px 0;background:#180e0e;border:1px solid rgba(232,75,75,.4);border-radius:3px;
  padding:10px 14px;font-family:var(--mono);font-size:10px;color:var(--red);
  letter-spacing:1px;line-height:1.6;display:none;
}
.error-rack.show{display:block}

.mixer{
  margin:10px 12px 12px;background:var(--panel);border:1px solid var(--border);
  border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 2px 8px rgba(0,0,0,.5);
  overflow:hidden;display:none;
}
.mixer.show{display:block}
.mixer-header{
  background:#181a1c;border-bottom:1px solid var(--border);padding:5px 12px;
  font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:3px;
  display:flex;align-items:center;justify-content:space-between;
}
.mixer-body{display:grid;grid-template-columns:1fr 1fr;gap:0}

.channel{
  border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:12px 10px 14px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:var(--panel);transition:background .2s;
}
.channel:nth-child(2),.channel:nth-child(4){border-right:none}
.channel:nth-child(3),.channel:nth-child(4){border-bottom:none}
.channel:hover{background:#232629}

.ch-top{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 2px}
.ch-name{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.ch-name.voc{color:var(--pink)}
.ch-name.drm{color:var(--amber)}
.ch-name.bas{color:var(--cyan)}
.ch-name.oth{color:var(--purple)}

.ch-led{width:8px;height:8px;border-radius:50%;background:#1a1a1a;border:1px solid #111;box-shadow:inset 0 1px 1px rgba(255,255,255,.05);transition:all .3s}
.ch-led.on.voc{background:var(--pink);box-shadow:0 0 6px var(--pink)}
.ch-led.on.drm{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.ch-led.on.bas{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.ch-led.on.oth{background:var(--purple);box-shadow:0 0 6px var(--purple)}

.knob-row{display:flex;gap:8px;justify-content:center}
.knob-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.knob-label{font-family:var(--mono);font-size:7px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}

.knob{
  width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#3a3d42,#1a1c1e);
  border:2px solid #111;
  box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
  position:relative;cursor:grab;touch-action:none;user-select:none;
}
.knob-indicator{
  position:absolute;width:3px;height:9px;background:var(--amber);
  border-radius:2px;top:3px;left:50%;margin-left:-1.5px;
  transform-origin:50% 1300%;
  pointer-events:none;
}
.knob-indicator.hi{background:var(--cyan)}
.knob-indicator.lo{background:var(--purple)}

.fader-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
.fader-track{
  width:100%;height:4px;
  background:#111;border:1px solid var(--border);border-radius:2px;
  position:relative;
}
.fader-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--dim),var(--amber));pointer-events:none;transition:width .04s}
input.fader{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.fader-val{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:1px}

.waveform{width:100%;height:26px;background:#111;border:1px solid var(--border);border-radius:2px;display:block}

.dl{
  width:100%;background:var(--raised);border:1px solid var(--border);border-radius:2px;
  padding:7px 6px;font-family:var(--ui);font-size:11px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--muted);
  cursor:not-allowed;text-align:center;text-decoration:none;display:block;transition:all .15s;
}
.dl.live{color:var(--text);border-color:var(--amber);cursor:default}

.console{
  background:#0e0f10;border-top:1px solid var(--border);
  padding:8px 14px;display:flex;align-items:center;justify-content:space-between;margin-top:auto;
}
.con-log{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1px}
.con-log .hi{color:var(--cyan)}
</style>
</head>
<body>
<div class="chassis">

  <div class="rack-header">
    <div style="width:20px"></div>
    <div class="brand">Stem<em>Forge</em></div>
    <div class="header-meters" id="hmMeters">
      <div class="hm"><div class="hm-fill" style="height:0%"></div></div>
      <div class="hm"><div class="hm-fill" style="height:0%"></div></div>
      <div class="hm"><div class="hm-fill" style="height:0%"></div></div>
      <div class="hm"><div class="hm-fill" style="height:0%"></div></div>
      <div class="hm"><div class="hm-fill" style="height:0%"></div></div>
      <div class="hm"><div class="hm-fill" style="height:0%"></div></div>
    </div>
    <div class="online-badge">
      <span class="led-round" id="onlineLed"></span>
      <span id="onlineTxt">—</span>
    </div>
    <div style="width:20px"></div>
  </div>

  <div class="upload-deck">
    <div class="deck-label">
      <span>INPUT DECK</span>
      <span id="deckStatus">NO SIGNAL</span>
    </div>
    <div class="deck-inner">
      <div class="drop-target" id="dropTarget">
        <div class="drop-title">Load Track</div>
        <div class="drop-sub">WAV · MP3 · FLAC</div>
        <div class="file-chip" id="fileChip"></div>
        <input type="file" id="fileInput" accept=".wav,.mp3,.flac,.aiff,.m4a">
      </div>
      <div class="transport-col">
        <button class="big-btn" id="processBtn" disabled></button>
        <div class="btn-label">SEPARATE</div>
      </div>
    </div>
  </div>

  <div class="progress-rack" id="progressRack">
    <div class="pr-top">
      <span class="pr-label" id="prLabel">Initializing</span>
      <span class="pr-time" id="prTime">—</span>
    </div>
    <div class="pr-track"><div class="pr-bar pulse" id="prBar"></div></div>
  </div>

  <div class="error-rack" id="errorRack"></div>

  <div class="mixer" id="mixer">
    <div class="mixer-header">
      <span>STEM CHANNELS</span>
      <span id="mixerStatus">STANDBY</span>
    </div>
    <div class="mixer-body">

      <!-- VOCALS -->
      <div class="channel">
        <div class="ch-top">
          <span class="ch-name voc">VOC</span>
          <span class="ch-led voc" id="led-vocals"></span>
        </div>
        <canvas class="waveform" id="wv-vocals"></canvas>
        <div class="knob-row">
          <div class="knob-wrap">
            <div class="knob" id="kn-voc-hi" data-val="60"><div class="knob-indicator hi"></div></div>
            <span class="knob-label">HI</span>
          </div>
          <div class="knob-wrap">
            <div class="knob" id="kn-voc-mid" data-val="50"><div class="knob-indicator"></div></div>
            <span class="knob-label">MID</span>
          </div>
          <div class="knob-wrap">
            <div class="knob" id="kn-voc-lo" data-val="40"><div class="knob-indicator lo"></div></div>
            <span class="knob-label">LO</span>
          </div>
        </div>
        <div class="fader-wrap">
          <div class="fader-track">
            <div class="fader-fill" id="ff-vocals" style="width:80%"></div>
            <input type="range" class="fader" min="0" max="100" value="80" oninput="updateFader('vocals',this.value)">
          </div>
          <span class="fader-val" id="fv-vocals">80</span>
        </div>
        <a class="dl" id="dl-vocals">Download</a>
      </div>

      <!-- DRUMS -->
      <div class="channel">
        <div class="ch-top">
          <span class="ch-name drm">DRM</span>
          <span class="ch-led drm" id="led-drums"></span>
        </div>
        <canvas class="waveform" id="wv-drums"></canvas>
        <div class="knob-row">
          <div class="knob-wrap">
            <div class="knob" id="kn-drm-hi" data-val="55"><div class="knob-indicator hi"></div></div>
            <span class="knob-label">HI</span>
          </div>
          <div class="knob-wrap">
            <div class="knob" id="kn-drm-mid" data-val="50"><div class="knob-indicator"></div></div>
            <span class="knob-label">MID</span>
          </div>
          <div class="knob-wrap">
            <div class="knob" id="kn-drm-lo" data-val="65"><div class="knob-indicator lo"></div></div>
            <span class="knob-label">LO</span>
          </div>
        </div>
        <div class="fader-wrap">
          <div class="fader-track">
            <div class="fader-fill" id="ff-drums" style="width:80%"></div>
            <input type="range" class="fader" min="0" max="100" value="80" oninput="updateFader('drums',this.value)">
          </div>
          <span class="fader-val" id="fv-drums">80</span>
        </div>
        <a class="dl" id="dl-drums">Download</a>
      </div>

      <!-- BASS -->
      <div class="channel">
        <div class="ch-top">
          <span class="ch-name bas">BAS</span>
          <span class="ch-led bas" id="led-bass"></span>
        </div>
        <canvas class="waveform" id="wv-bass"></canvas>
        <div class="knob-row">
          <div class="knob-wrap">
            <div class="knob" id="kn-bas-hi" data-val="35"><div class="knob-indicator hi"></div></div>
            <span class="knob-label">HI</span>
          </div>
          <div class="knob-wrap">
            <div class="knob" id="kn-bas-mid" data-val="50"><div class="knob-indicator"></div></div>
            <span class="knob-label">MID</span>
          </div>
          <div class="knob-wrap">
            <div class="knob" id="kn-bas-lo" data-val="70"><div class="knob-indicator lo"></div></div>
            <span class="knob-label">LO</span>
          </div>
        </div>
        <div class="fader-wrap">
          <div class="fader-track">
            <div class="fader-fill" id="ff-bass" style="width:80%"></div>
            <input type="range" class="fader" min="0" max="100" value="80" oninput="updateFader('bass',this.value)">
          </div>
          <span class="fader-val" id="fv-bass">80</span>
        </div>
        <a class="dl" id="dl-bass">Download</a>
      </div>

      <!-- OTHER -->
      <div class="channel">
        <div class="ch-top">
          <span class="ch-name oth">OTH</span>
          <span class="ch-led oth" id="led-other"></span>
        </div>
        <canvas class="waveform" id="wv-other"></canvas>
        <div class="knob-row">
          <div class="knob-wrap">
            <div class="knob" id="kn-oth-hi" data-val="50"><div class="knob-indicator hi"></div></div>
            <span class="knob-label">HI</span>
          </div>
          <div class="knob-wrap">
            <div class="knob" id="kn-oth-mid" data-val="50"><div class="knob-indicator"></div></div>
            <span class="knob-label">MID</span>
          </div>
          <div class="knob-wrap">
            <div class="knob" id="kn-oth-lo" data-val="50"><div class="knob-indicator lo"></div></div>
            <span class="knob-label">LO</span>
          </div>
        </div>
        <div class="fader-wrap">
          <div class="fader-track">
            <div class="fader-fill" id="ff-other" style="width:80%"></div>
            <input type="range" class="fader" min="0" max="100" value="80" oninput="updateFader('other',this.value)">
          </div>
          <span class="fader-val" id="fv-other">80</span>
        </div>
        <a class="dl" id="dl-other">Download</a>
      </div>

    </div>
  </div>

  <div class="console">
    <div class="con-log" id="conLog">StemForge v2.0 — <span class="hi">Initializing</span></div>
    <div class="con-log">htdemucs · 4-stem</div>
  </div>

</div>
<script>
const API = 'https://ryanrealaf-stemforge.hf.space';
let selectedFile = null, vuAnim = null, timerAnim = null;
const $ = id => document.getElementById(id);

// KNOBS
function initKnobs(){
  document.querySelectorAll('.knob').forEach(knob => {
    const ind = knob.querySelector('.knob-indicator');
    let startY, startVal;
    const getVal = () => parseInt(knob.dataset.val)||50;
    const setAngle = v => { if(ind) ind.style.transform = `rotate(${-135+(v/100)*270}deg)`; };
    setAngle(getVal());
    const onMove = e => {
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const nv = Math.max(0,Math.min(100, startVal + (startY-cy)*1.2));
      knob.dataset.val = Math.round(nv);
      setAngle(nv);
    };
    const onUp = () => {
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      document.removeEventListener('touchmove',onMove);
      document.removeEventListener('touchend',onUp);
    };
    const onDown = e => {
      e.preventDefault();
      startY = e.touches ? e.touches[0].clientY : e.clientY;
      startVal = getVal();
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
      document.addEventListener('touchmove',onMove,{passive:false});
      document.addEventListener('touchend',onUp);
    };
    knob.addEventListener('mousedown',onDown);
    knob.addEventListener('touchstart',onDown,{passive:false});
  });
}
initKnobs();

function updateFader(stem, val){
  $('ff-'+stem).style.width = val+'%';
  $('fv-'+stem).textContent = val;
}

function log(msg, hi){
  $('conLog').innerHTML = hi
    ? `StemForge v2.0 — <span class="hi">${msg}</span>`
    : `StemForge v2.0 — ${msg}`;
}

async function ping(){
  try{
    const r = await fetch(`${API}/`);
    const d = await r.json();
    const ok = d.status==='ok';
    $('onlineLed').className = 'led-round'+(ok?' on':' red');
    $('onlineTxt').textContent = ok?'ONLINE':'OFFLINE';
    log(ok?'Backend online':'Backend offline', ok);
  }catch(e){
    $('onlineLed').className='led-round red';
    $('onlineTxt').textContent='OFFLINE';
    log('Backend unreachable');
  }
}
ping();

$('fileInput').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  selectedFile = f;
  const name = f.name.length>24 ? f.name.slice(0,21)+'...' : f.name;
  $('fileChip').textContent = '▶ '+name;
  $('fileChip').style.display = 'block';
  $('dropTarget').classList.add('loaded');
  $('deckStatus').textContent = 'LOADED';
  $('processBtn').disabled = false;
  log('Track loaded — press SEPARATE', true);
  drawPlaceholder();
  $('mixer').classList.add('show');
});

const dt = $('dropTarget');
dt.addEventListener('dragover', e=>{e.preventDefault();dt.classList.add('over')});
dt.addEventListener('dragleave', ()=>dt.classList.remove('over'));
dt.addEventListener('drop', e=>{
  e.preventDefault();dt.classList.remove('over');
  const f=e.dataTransfer.files[0];
  if(f){$('fileInput').files=e.dataTransfer.files;$('fileInput').dispatchEvent(new Event('change'));}
});

function drawWave(id, color, ghost){
  const cv=$(id); if(!cv) return;
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.offsetWidth*dpr; cv.height=cv.offsetHeight*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const w=cv.offsetWidth,h=cv.offsetHeight;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle=color; ctx.lineWidth=1; ctx.beginPath();
  for(let i=0;i<60;i++){
    const x=(i/60)*w;
    const amp=ghost?(.04+Math.random()*.1):(.1+Math.random()*.75);
    const y=h/2+(Math.random()-.5)*h*amp;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
}

function drawPlaceholder(){
  drawWave('wv-vocals','#3a2030',true);
  drawWave('wv-drums','#302810',true);
  drawWave('wv-bass','#0e2e2a',true);
  drawWave('wv-other','#1e1530',true);
}

function drawActive(){
  drawWave('wv-vocals','#e84b9a',false);
  drawWave('wv-drums','#e8b84b',false);
  drawWave('wv-bass','#4be8c8',false);
  drawWave('wv-other','#9a6be8',false);
}

function startVU(){
  const fills=document.querySelectorAll('.hm-fill');
  vuAnim=setInterval(()=>{ fills.forEach(f=>f.style.height=(10+Math.random()*85)+'%'); },100);
}
function stopVU(){
  clearInterval(vuAnim);
  document.querySelectorAll('.hm-fill').forEach(f=>f.style.height='0%');
}

function showError(msg){
  const el=$('errorRack'); el.textContent='⚠ '+msg; el.classList.add('show');
}

$('processBtn').addEventListener('click', async () => {
  if(!selectedFile) return;
  $('errorRack').classList.remove('show');
  ['vocals','drums','bass','other'].forEach(s=>{
    const cl={vocals:'voc',drums:'drm',bass:'bas',other:'oth'}[s];
    $('led-'+s).className='ch-led '+cl;
    const dl=$('dl-'+s); dl.className='dl'; dl.textContent='Download';
  });

  $('processBtn').disabled=true;
  $('progressRack').classList.add('show');
  $('prBar').style.width='4%'; $('prBar').classList.add('pulse');
  $('prLabel').textContent='Uploading track';
  $('prTime').textContent='—';
  $('mixerStatus').textContent='PROCESSING';
  log('Uploading track');
  startVU();
  const t0=Date.now();

  timerAnim=setInterval(()=>{
    const el=Math.round((Date.now()-t0)/1000);
    const m=Math.floor(el/60),s=el%60;
    $('prTime').textContent=m+':'+s.toString().padStart(2,'0');
    $('prBar').style.width=Math.min(4+(el/300)*87,91)+'%';
    if(el>10) $('prLabel').textContent='Demucs processing — CPU';
  },1000);

  const fd=new FormData(); fd.append('file',selectedFile);

  try{
    const r=await fetch(`${API}/separate`,{method:'POST',body:fd});
    clearInterval(timerAnim); stopVU();

    if(!r.ok){
      let em='Separation failed';
      try{const ed=await r.json();em=ed.error||em;}catch(e){}
      $('progressRack').classList.remove('show');
      $('processBtn').disabled=false;
      $('mixerStatus').textContent='ERROR';
      showError(em.slice(0,200));
      log('Separation failed');
      return;
    }

    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='stems_'+selectedFile.name.replace(/\.[^.]+$/,'')+'.zip';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);

    $('prBar').classList.remove('pulse'); $('prBar').style.width='100%';
    $('prLabel').textContent='Complete — ZIP downloading';
    $('mixerStatus').textContent='COMPLETE';

    const el=Math.round((Date.now()-t0)/1000);
    $('prTime').textContent=Math.floor(el/60)+':'+(el%60).toString().padStart(2,'0');

    drawActive();
    const cls={vocals:'voc',drums:'drm',bass:'bas',other:'oth'};
    ['vocals','drums','bass','other'].forEach(s=>{
      $('led-'+s).className='ch-led '+cls[s]+' on';
      const dl=$('dl-'+s); dl.className='dl live'; dl.textContent='In ZIP ✓';
    });

    $('processBtn').disabled=false;
    log('4 stems ready — ZIP downloaded', true);

  }catch(e){
    clearInterval(timerAnim); stopVU();
    $('progressRack').classList.remove('show');
    $('processBtn').disabled=false;
    $('mixerStatus').textContent='ERROR';
    showError(e.message||'Network error');
    log('Network error');
  }
});
</script>
</body>
